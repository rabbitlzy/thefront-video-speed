<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>学习视频倍速</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>学习视频倍速</h1>
  <p>适用于 bit.thefront.cn</p>
  <label class="toggle"><input id="enabled" type="checkbox"> 启用自动倍速</label>
  <label for="speed">播放速度</label>
  <select id="speed">
    <option value="1">1.0 × · 原速</option>
    <option value="1.25">1.25 ×</option>
    <option value="1.5">1.5 × · 推荐</option>
    <option value="1.75">1.75 ×</option>
    <option value="2">2.0 ×</option>
  </select>
  <p id="status" role="status">正在读取设置…</p>
  <small>首次安装后请刷新课程页面，再点击播放。设置会自动保存。</small>
  <script src="popup.js"></script>
</body>
</html>
